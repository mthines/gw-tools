name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      test_release:
        description: "Test release job (dry-run, no actual publishing)"
        type: boolean
        default: false
      version:
        description: "Version to simulate (e.g., 0.28.1) - only used if test_release is true"
        type: string
        default: "0.0.0-test"

# Default permissions for all jobs
permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="typecheck"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Configure git for tests that create commits
      - name: Configure git
        run: |
          git config --global user.email "ci@gw-tools.dev"
          git config --global user.name "CI"

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      - run: npx nx-cloud record -- npx nx format:check --base="remotes/origin/main" || echo "Format check failed"

      # Use Deno-compatible targets (test) instead of tsc-based (build, typecheck)
      - run: npx nx run @gw-tools/gw-tool:test:ci

  auto-tag:
    # Only run on push to main (not tags, not PRs, not manual dispatch)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      # Use PAT to allow tag push to trigger release workflow
      # Falls back to GITHUB_TOKEN if GH_PAT not set (but release won't auto-trigger)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Check for releasable changes and create tag
        id: tag
        run: |
          # Skip if this is a release commit
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if [[ "$COMMIT_MSG" =~ ^chore\(gw\):\ release\ v ]]; then
            echo "Skipping - this is a release commit"
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if gw-tool source files changed since last tag
          LAST_TAG=$(git tag -l "v*" --sort=-version:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            CHANGED=$(git diff --name-only HEAD~1 -- packages/gw-tool/src/)
          else
            CHANGED=$(git diff --name-only "$LAST_TAG"..HEAD -- packages/gw-tool/src/)
          fi

          if [ -z "$CHANGED" ]; then
            echo "No gw-tool source changes since last release"
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changes detected:"
          echo "$CHANGED"

          # Get commits since last tag for version determination
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" --no-merges -- packages/gw-tool/)
          else
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s" --no-merges -- packages/gw-tool/)
          fi

          # Determine bump type from conventional commits
          BUMP_TYPE="patch"
          if echo "$COMMITS" | grep -qE "^(BREAKING CHANGE:|.*!:)"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -q "^feat"; then
            BUMP_TYPE="minor"
          fi
          echo "Bump type: $BUMP_TYPE"

          # Get current version and calculate new version
          CURRENT=$(cat packages/gw-tool/npm/package.json | grep '"version"' | sed 's/.*"version": "\([^"]*\)".*/\1/')
          IFS='.' read -ra V <<< "$CURRENT"

          case "$BUMP_TYPE" in
            major) V[0]=$((V[0] + 1)); V[1]=0; V[2]=0 ;;
            minor) V[1]=$((V[1] + 1)); V[2]=0 ;;
            patch) V[2]=$((V[2] + 1)) ;;
          esac

          NEW_VERSION="${V[0]}.${V[1]}.${V[2]}"
          echo "New version: $NEW_VERSION"

          # Update package.json version
          cd packages/gw-tool/npm
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" package.json
          cd -

          # Commit and tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/gw-tool/npm/package.json
          git commit -m "chore(gw): release v$NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"

          # Push commit and tag
          git push origin main
          git push origin "v$NEW_VERSION"

          echo "created=true" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

  release:
    # Run on tag pushes OR manual dispatch with test_release=true
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.test_release)
    needs: test
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write      # For creating GitHub releases
      id-token: write      # For npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          # For manual test runs, simulate a version
          GITHUB_REF_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: npx nx run @gw-tools/gw-tool:release:ci
