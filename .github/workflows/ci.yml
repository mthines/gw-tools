name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      force_gw:
        description: 'Force gw-tool release'
        type: boolean
        default: false
      force_agent:
        description: 'Force agent release'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no publishing)'
        type: boolean
        default: false

# Default permissions for all jobs
permissions:
  actions: read
  contents: read

jobs:
  # =============================================================================
  # Step 1: Detect which projects have changes
  # =============================================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      gw_changed: ${{ steps.detect.outputs.gw_changed }}
      agent_changed: ${{ steps.detect.outputs.agent_changed }}
      is_beta: ${{ steps.detect.outputs.is_beta }}
      pr_number: ${{ steps.detect.outputs.pr_number }}
      base_ref: ${{ steps.detect.outputs.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Detect changes
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_GW: ${{ inputs.force_gw }}
          FORCE_AGENT: ${{ inputs.force_agent }}
        run: |
          # Determine context
          IS_BETA="false"
          PR_NUMBER=""
          BASE_REF="main"

          if [ "${{ github.event_name }}" = "push" ]; then
            # Push to main - find last stable tag as base
            LAST_STABLE_TAG=$(git tag -l "v*" --sort=-version:refname | grep -v "beta" | head -n 1 || echo "")
            if [ -n "$LAST_STABLE_TAG" ]; then
              BASE_REF="$LAST_STABLE_TAG"
            else
              # No tags yet, use HEAD~1
              BASE_REF="HEAD~1"
            fi
            echo "::notice::Push to main - comparing against $BASE_REF"

          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR - use PR base branch
            BASE_REF="origin/${{ github.base_ref }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            # Beta only for non-draft PRs
            if [ "${{ github.event.pull_request.draft }}" = "false" ]; then
              IS_BETA="true"
            fi
            echo "::notice::PR #$PR_NUMBER - comparing against $BASE_REF (draft=${{ github.event.pull_request.draft }})"

          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              # Main branch - find last stable tag
              LAST_STABLE_TAG=$(git tag -l "v*" --sort=-version:refname | grep -v "beta" | head -n 1 || echo "")
              if [ -n "$LAST_STABLE_TAG" ]; then
                BASE_REF="$LAST_STABLE_TAG"
              else
                BASE_REF="HEAD~1"
              fi
            else
              # Non-main branch - check for open PR
              PR_INFO=$(gh pr view --json number,baseRefName,state 2>/dev/null || echo "")
              if [ -n "$PR_INFO" ]; then
                PR_STATE=$(echo "$PR_INFO" | jq -r '.state')
                if [ "$PR_STATE" = "OPEN" ]; then
                  PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number')
                  BASE_REF="origin/$(echo "$PR_INFO" | jq -r '.baseRefName')"
                  IS_BETA="true"
                  echo "::notice::Manual trigger with open PR #$PR_NUMBER"
                fi
              fi
              # If no PR, use HEAD~1
              if [ -z "$PR_NUMBER" ]; then
                BASE_REF="HEAD~1"
              fi
            fi
            echo "::notice::Manual trigger - comparing against $BASE_REF"
          fi

          # Skip release commit
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if [[ "$COMMIT_MSG" =~ ^chore\((gw|autonomous-workflow-agent)\):\ release ]]; then
            echo "::notice::Skipping - this is a release commit"
            echo "gw_changed=false" >> $GITHUB_OUTPUT
            echo "agent_changed=false" >> $GITHUB_OUTPUT
            echo "is_beta=$IS_BETA" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Use Nx to detect affected projects
          echo "::group::Nx affected projects"
          AFFECTED=$(npx nx show projects --affected --base="$BASE_REF" 2>/dev/null || echo "")
          echo "Affected projects: $AFFECTED"
          echo "::endgroup::"

          # Check for gw-tool changes
          GW_CHANGED="false"
          if [ "$FORCE_GW" = "true" ]; then
            GW_CHANGED="true"
            echo "::notice::gw-tool: force release enabled"
          elif echo "$AFFECTED" | grep -q "@gw-tools/gw-tool"; then
            GW_CHANGED="true"
            echo "::notice::gw-tool: changes detected"
          else
            echo "::notice::gw-tool: no changes"
          fi

          # Check for agent changes
          AGENT_CHANGED="false"
          if [ "$FORCE_AGENT" = "true" ]; then
            AGENT_CHANGED="true"
            echo "::notice::autonomous-workflow-agent: force release enabled"
          elif echo "$AFFECTED" | grep -q "autonomous-workflow-agent"; then
            AGENT_CHANGED="true"
            echo "::notice::autonomous-workflow-agent: changes detected"
          else
            echo "::notice::autonomous-workflow-agent: no changes"
          fi

          # Output results
          echo "gw_changed=$GW_CHANGED" >> $GITHUB_OUTPUT
          echo "agent_changed=$AGENT_CHANGED" >> $GITHUB_OUTPUT
          echo "is_beta=$IS_BETA" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT

  # =============================================================================
  # Step 2: Test jobs (run in parallel)
  # =============================================================================
  test-gw:
    needs: detect-changes
    if: needs.detect-changes.outputs.gw_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config --global user.email "ci@gw-tools.dev"
          git config --global user.name "CI"

      - name: Check formatting
        run: |
          if ! npx nx format:check --base="remotes/origin/main" 2>/dev/null; then
            echo "::warning::Formatting issues detected. Run 'nx format:write' locally to fix."
          fi

      - name: Test gw-tool
        run: npx nx run @gw-tools/gw-tool:test:ci

  test-agent:
    needs: detect-changes
    if: needs.detect-changes.outputs.agent_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build agent package
        run: npx nx build autonomous-workflow-agent

      - name: Test agent package
        run: npx nx test autonomous-workflow-agent

      - name: Lint agent package
        run: npx nx lint autonomous-workflow-agent

  # =============================================================================
  # Step 3: Version jobs (calculate version, create tag)
  # =============================================================================
  version-gw:
    needs: [detect-changes, test-gw]
    # Run if:
    # - Tests passed (or were skipped because no changes)
    # - gw changed OR force release
    # - Not a dry run
    # - Push to main (stable) OR non-draft PR (beta) OR manual with open PR (beta)
    if: |
      always() &&
      (needs.test-gw.result == 'success' || needs.test-gw.result == 'skipped') &&
      needs.detect-changes.outputs.gw_changed == 'true' &&
      !inputs.dry_run &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
        (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || needs.detect-changes.outputs.pr_number != ''))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Calculate version
        id: version
        env:
          IS_BETA: ${{ needs.detect-changes.outputs.is_beta }}
          PR_NUMBER: ${{ needs.detect-changes.outputs.pr_number }}
          BASE_REF: ${{ needs.detect-changes.outputs.base_ref }}
        run: |
          echo "::group::Commit analysis"

          # Get commits for version determination
          COMMITS=$(git log "${BASE_REF}"..HEAD --pretty=format:"%s" --no-merges -- packages/gw-tool/ 2>/dev/null || git log HEAD~10..HEAD --pretty=format:"%s" --no-merges -- packages/gw-tool/)
          echo "Commits since $BASE_REF:"
          echo "$COMMITS"

          # Determine bump type from conventional commits
          BUMP_TYPE="patch"
          if echo "$COMMITS" | grep -qE "^(BREAKING CHANGE:|.*!:)"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -q "^feat"; then
            BUMP_TYPE="minor"
          fi
          echo "Bump type: $BUMP_TYPE"
          echo "::endgroup::"

          # Get current version
          CURRENT=$(cat packages/gw-tool/npm/package.json | grep '"version"' | sed 's/.*"version": "\([^"]*\)".*/\1/')
          # Strip any existing prerelease suffix
          BASE_CURRENT=$(echo "$CURRENT" | sed -E 's/-.*$//')
          IFS='.' read -ra V <<< "$BASE_CURRENT"

          # Calculate new version
          case "$BUMP_TYPE" in
            major) V[0]=$((V[0] + 1)); V[1]=0; V[2]=0 ;;
            minor) V[1]=$((V[1] + 1)); V[2]=0 ;;
            patch) V[2]=$((V[2] + 1)) ;;
          esac

          BASE_VERSION="${V[0]}.${V[1]}.${V[2]}"

          if [ "$IS_BETA" = "true" ] && [ -n "$PR_NUMBER" ]; then
            # Beta version: v{version}-beta.{pr#}.{n}
            EXISTING=$(git tag -l "v${BASE_VERSION}-beta.${PR_NUMBER}.*" | wc -l | tr -d ' ')
            BETA_NUM=$((EXISTING + 1))
            NEW_VERSION="${BASE_VERSION}-beta.${PR_NUMBER}.${BETA_NUM}"
            echo "::notice::Beta version: $NEW_VERSION"
          else
            # Stable version
            NEW_VERSION="$BASE_VERSION"
            echo "::notice::Stable version: $NEW_VERSION"
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create tag
        id: tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          IS_BETA="${{ needs.detect-changes.outputs.is_beta }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$IS_BETA" = "true" ]; then
            # Beta: just tag, don't update package.json
            git tag -a "$TAG" -m "Beta release $TAG"
            git push origin "$TAG"
            echo "::notice::Created beta tag $TAG"
          else
            # Stable: update package.json, commit, then tag
            cd packages/gw-tool/npm
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
            cd -

            git add packages/gw-tool/npm/package.json
            git commit -m "chore(gw): release $TAG"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin main
            git push origin "$TAG"
            echo "::notice::Created stable release $TAG"
          fi

          echo "created=true" >> $GITHUB_OUTPUT

  version-agent:
    # Waits for gw release to complete to avoid git push race conditions
    needs: [detect-changes, test-agent, release-gw]
    # Agent only releases stable versions from main branch
    if: |
      always() &&
      (needs.test-agent.result == 'success' || needs.test-agent.result == 'skipped') &&
      (needs.release-gw.result == 'success' || needs.release-gw.result == 'skipped') &&
      needs.detect-changes.outputs.agent_changed == 'true' &&
      !inputs.dry_run &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_agent))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      # Checkout latest main to include any commits from gw release
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Fetch latest main and tags
        run: |
          git fetch origin main --tags --force
          git reset --hard origin/main
          echo "::notice::Checked out main at $(git rev-parse --short HEAD)"

      - name: Calculate version
        id: version
        env:
          BASE_REF: ${{ needs.detect-changes.outputs.base_ref }}
        run: |
          # Get commits for version determination
          LAST_AGENT_TAG=$(git tag -l "autonomous-workflow-agent-v*" --sort=-version:refname | head -n 1 || echo "")

          if [ -n "$LAST_AGENT_TAG" ]; then
            COMMITS=$(git log "$LAST_AGENT_TAG"..HEAD --pretty=format:"%s" --no-merges -- packages/autonomous-workflow-agent/)
          else
            COMMITS=$(git log HEAD~10..HEAD --pretty=format:"%s" --no-merges -- packages/autonomous-workflow-agent/)
          fi

          # Determine bump type
          BUMP_TYPE="patch"
          if echo "$COMMITS" | grep -qE "^(BREAKING CHANGE:|.*!:)"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -q "^feat"; then
            BUMP_TYPE="minor"
          fi

          # Get current version
          CURRENT=$(cat packages/autonomous-workflow-agent/package.json | grep '"version"' | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          IFS='.' read -ra V <<< "$CURRENT"

          case "$BUMP_TYPE" in
            major) V[0]=$((V[0] + 1)); V[1]=0; V[2]=0 ;;
            minor) V[1]=$((V[1] + 1)); V[2]=0 ;;
            patch) V[2]=$((V[2] + 1)) ;;
          esac

          NEW_VERSION="${V[0]}.${V[1]}.${V[2]}"

          echo "::notice::autonomous-workflow-agent: $CURRENT -> $NEW_VERSION ($BUMP_TYPE)"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=autonomous-workflow-agent-v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create tag
        id: tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update package.json
          cd packages/autonomous-workflow-agent
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          cd -

          git add packages/autonomous-workflow-agent/package.json
          git commit -m "chore(autonomous-workflow-agent): release v$VERSION"
          git tag -a "$TAG" -m "Release autonomous-workflow-agent v$VERSION"
          git push origin main
          git push origin "$TAG"

          echo "::notice::Created tag $TAG"
          echo "created=true" >> $GITHUB_OUTPUT

  # =============================================================================
  # Step 4: Release jobs
  # =============================================================================
  release-gw:
    needs: [detect-changes, version-gw]
    if: |
      always() &&
      needs.version-gw.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version-gw.outputs.tag }}
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Set build version
        run: |
          VERSION="${{ needs.version-gw.outputs.version }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" packages/gw-tool/npm/package.json
          echo "::notice::Set build version to $VERSION"

      - name: Run release script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          RELEASE_VERSION: ${{ needs.version-gw.outputs.tag }}
          SKIP_NPM: 'true'
        run: npx nx run @gw-tools/gw-tool:release:ci

      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        working-directory: dist/packages/gw-tool/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ needs.version-gw.outputs.version }}"

          # Update version in dist package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          echo "Publishing @gw-tools/gw@$VERSION"

          # Determine npm tag
          if [[ "$VERSION" == *"-"* ]]; then
            NPM_TAG=$(echo "$VERSION" | sed -E 's/.*-([^.]+)\..*/\1/')
            echo "Publishing with tag: $NPM_TAG"
            npm publish --provenance --access public --tag "$NPM_TAG"
          else
            npm publish --provenance --access public
          fi

      - name: Comment on PR (beta releases)
        if: contains(needs.version-gw.outputs.version, '-beta.')
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.version-gw.outputs.version }}';
            const prNumber = '${{ needs.detect-changes.outputs.pr_number }}';
            const body = `## 🧪 Beta Release Published

            **Version:** \`${version}\`

            ### Install
            \`\`\`bash
            # npm
            npm install @gw-tools/gw@beta

            # homebrew
            brew install mthines/gw-tools/gw-beta
            \`\`\`

            [View Release](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/v${version})`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
              body: body.split('\n').map(line => line.trim()).join('\n')
            });

  release-agent:
    needs: [detect-changes, version-agent]
    if: |
      always() &&
      needs.version-agent.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version-agent.outputs.tag }}
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Build package
        run: npx nx build autonomous-workflow-agent

      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        working-directory: dist/packages/autonomous-workflow-agent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ needs.version-agent.outputs.version }}"
          echo "Publishing @gw-tools/autonomous-workflow-agent@$VERSION"
          npm publish --provenance --access public
