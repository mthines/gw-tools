name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '!v*-beta.*' # Beta tags are released by the PR workflow, not tag push
  pull_request:
  workflow_dispatch:
    inputs:
      test_release:
        description: 'Test release job (dry-run, no actual publishing)'
        type: boolean
        default: false
      force_release:
        description: 'Force gw-tool release even without source changes (actual publish)'
        type: boolean
        default: false
      force_release_agent:
        description: 'Force autonomous-workflow-agent release even without source changes (actual publish)'
        type: boolean
        default: false
      version:
        description: 'Version to simulate (e.g., 0.28.1) - only for test_release dry-runs, ignored by force_release'
        type: string
        default: '0.0.0-test'

# Default permissions for all jobs
permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="typecheck"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Configure git for tests that create commits
      - name: Configure git
        run: |
          git config --global user.email "ci@gw-tools.dev"
          git config --global user.name "CI"

      # Check formatting (warn but don't block)
      - name: Check formatting
        run: |
          if ! npx nx format:check --base="remotes/origin/main" 2>/dev/null; then
            echo "::warning::Formatting issues detected. Run 'nx format:write' locally to fix."
          fi

      # Use Deno-compatible targets (test) instead of tsc-based (build, typecheck)
      - run: npx nx run @gw-tools/gw-tool:test:ci

  auto-tag-beta:
    # Run on non-draft PRs to create beta releases
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.tag.outputs.created || 'false' }}
      version: ${{ steps.tag.outputs.version || '' }}
      pr_number: ${{ steps.tag.outputs.pr_number || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Check for releasable changes
        id: check
        run: |
          # Check if gw-tool source files changed in this PR
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- packages/gw-tool/src/)

          if [ -z "$CHANGED" ]; then
            echo "::notice::⏭️ No source changes in packages/gw-tool/src/"
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Calculate beta version
        if: steps.check.outputs.should_release == 'true'
        id: version
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          echo "📦 Source files changed:"
          echo "${{ steps.check.outputs.changed_files }}"

          # Get commits for version determination
          COMMITS=$(git log origin/${{ github.base_ref }}...HEAD --pretty=format:"%s" --no-merges -- packages/gw-tool/)

          # Determine bump type from conventional commits
          BUMP_TYPE="patch"
          if echo "$COMMITS" | grep -qE "^(BREAKING CHANGE:|.*!:)"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -q "^feat"; then
            BUMP_TYPE="minor"
          fi

          # Get current version and calculate base version
          CURRENT=$(cat packages/gw-tool/npm/package.json | grep '"version"' | sed 's/.*"version": "\([^"]*\)".*/\1/')
          # Strip any existing prerelease suffix
          BASE_CURRENT=$(echo "$CURRENT" | sed -E 's/-.*$//')
          IFS='.' read -ra V <<< "$BASE_CURRENT"

          case "$BUMP_TYPE" in
            major) V[0]=$((V[0] + 1)); V[1]=0; V[2]=0 ;;
            minor) V[1]=$((V[1] + 1)); V[2]=0 ;;
            patch) V[2]=$((V[2] + 1)) ;;
          esac

          BASE_VERSION="${V[0]}.${V[1]}.${V[2]}"

          # Find next beta number for this PR
          EXISTING_BETAS=$(git tag -l "v${BASE_VERSION}-beta.${PR_NUMBER}.*" | wc -l)
          BETA_NUM=$((EXISTING_BETAS + 1))

          NEW_VERSION="${BASE_VERSION}-beta.${PR_NUMBER}.${BETA_NUM}"

          echo "::notice::🧪 Beta version: $NEW_VERSION ($BUMP_TYPE bump, PR #$PR_NUMBER)"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Create beta tag
        if: steps.check.outputs.should_release == 'true'
        id: tag
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create tag (don't modify package.json for betas - just tag the commit)
          git tag -a "v$NEW_VERSION" -m "Beta release v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

          echo "::notice::🏷️ Created beta tag v$NEW_VERSION"
          echo "created=true" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

  auto-tag:
    # Run on push to main OR manual dispatch with force_release
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.force_release)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created || 'false' }}
      version: ${{ steps.tag.outputs.version || '' }}
    steps:
      # Use PAT to allow tag push to trigger release workflow
      # Falls back to GITHUB_TOKEN if GH_PAT not set (but release won't auto-trigger)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Check for releasable changes
        id: check
        env:
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          # Force release bypasses all checks
          if [ "$FORCE_RELEASE" = "true" ]; then
            echo "::notice::🚀 Force release enabled - skipping change detection"
            echo "should_release=true" >> $GITHUB_OUTPUT
            LAST_TAG=$(git tag -l "v*" --sort=-version:refname | grep -v "beta" | head -n 1)
            echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Skip if this is a release commit
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if [[ "$COMMIT_MSG" =~ ^chore\(gw\):\ release\ v ]]; then
            echo "reason=release-commit" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if gw-tool source files changed since last STABLE tag
          # (exclude beta tags - beta releases shouldn't block stable releases)
          LAST_TAG=$(git tag -l "v*" --sort=-version:refname | grep -v "beta" | head -n 1)
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

          if [ -z "$LAST_TAG" ]; then
            CHANGED=$(git diff --name-only HEAD~1 -- packages/gw-tool/src/)
          else
            CHANGED=$(git diff --name-only "$LAST_TAG"..HEAD -- packages/gw-tool/src/)
          fi

          if [ -z "$CHANGED" ]; then
            echo "reason=no-source-changes" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Skip - No release needed
        if: steps.check.outputs.should_release == 'false'
        run: |
          if [ "${{ steps.check.outputs.reason }}" = "release-commit" ]; then
            echo "::notice::⏭️ Skipping release - this is already a release commit"
          else
            echo "::notice::⏭️ No release needed - no source changes in packages/gw-tool/src/ since ${{ steps.check.outputs.last_tag || 'initial commit' }}"
          fi
          echo "created=false" >> $GITHUB_OUTPUT
        id: skip

      - name: Calculate version
        if: steps.check.outputs.should_release == 'true'
        id: version
        run: |
          LAST_TAG="${{ steps.check.outputs.last_tag }}"

          echo "📦 Source files changed:"
          echo "${{ steps.check.outputs.changed_files }}"

          # Get commits since last tag for version determination
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" --no-merges -- packages/gw-tool/)
          else
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s" --no-merges -- packages/gw-tool/)
          fi

          # Determine bump type from conventional commits
          BUMP_TYPE="patch"
          if echo "$COMMITS" | grep -qE "^(BREAKING CHANGE:|.*!:)"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -q "^feat"; then
            BUMP_TYPE="minor"
          fi

          # Get current version and calculate new version
          CURRENT=$(cat packages/gw-tool/npm/package.json | grep '"version"' | sed 's/.*"version": "\([^"]*\)".*/\1/')
          # Strip any existing prerelease suffix (e.g., -beta.x)
          BASE_CURRENT=$(echo "$CURRENT" | sed -E 's/-.*$//')
          IFS='.' read -ra V <<< "$BASE_CURRENT"

          case "$BUMP_TYPE" in
            major) V[0]=$((V[0] + 1)); V[1]=0; V[2]=0 ;;
            minor) V[1]=$((V[1] + 1)); V[2]=0 ;;
            patch) V[2]=$((V[2] + 1)) ;;
          esac

          NEW_VERSION="${V[0]}.${V[1]}.${V[2]}"

          echo "::notice::📦 Version bump: $CURRENT → $NEW_VERSION ($BUMP_TYPE)"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Create release tag
        if: steps.check.outputs.should_release == 'true'
        id: tag
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          # Update package.json version
          cd packages/gw-tool/npm
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" package.json
          cd -

          # Commit and tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/gw-tool/npm/package.json
          git commit -m "chore(gw): release v$NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"

          # Push commit and tag
          git push origin main
          git push origin "v$NEW_VERSION"

          echo "::notice::🏷️ Created and pushed tag v$NEW_VERSION"
          echo "created=true" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

  release:
    # Run when:
    # 1. Tag push (v*) - direct tag push triggers release
    # 2. auto-tag created a new stable version
    # 3. auto-tag-beta created a new beta version
    # 4. Manual dispatch with test_release=true - dry-run testing
    needs: [test, auto-tag, auto-tag-beta]
    # Note: Beta tag pushes are skipped here - beta releases are handled by the PR workflow
    # that created the tag. Only stable tag pushes trigger release from tag event.
    if: |
      always() &&
      needs.test.result == 'success' &&
      (
        (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-beta.')) ||
        needs.auto-tag.outputs.created == 'true' ||
        needs.auto-tag-beta.outputs.created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.test_release)
      )
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # For creating GitHub releases
      id-token: write # For npm trusted publishing (OIDC)
      pull-requests: write # For commenting on PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use PAT to ensure we can see tags just pushed by auto-tag jobs
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Fetch all tags
        run: |
          git fetch --tags --force
          echo "::group::Available tags"
          git tag -l "v*" --sort=-version:refname | head -20
          echo "::endgroup::"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Determine version
        id: version
        env:
          # Pass context as env vars to avoid GitHub expression substitution issues in bash
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_VERSION: ${{ inputs.version }}
          AUTO_TAG_CREATED: ${{ needs.auto-tag.outputs.created }}
          AUTO_TAG_BETA_CREATED: ${{ needs.auto-tag-beta.outputs.created }}
        run: |
          echo "::group::Debug context"
          echo "GH_REF: $GH_REF"
          echo "GH_REF_NAME: $GH_REF_NAME"
          echo "PR_NUMBER: $PR_NUMBER"
          echo "INPUT_VERSION: $INPUT_VERSION"
          echo "AUTO_TAG_CREATED: $AUTO_TAG_CREATED"
          echo "AUTO_TAG_BETA_CREATED: $AUTO_TAG_BETA_CREATED"
          echo "::endgroup::"

          VERSION=""

          # Priority 1: Direct tag push
          if [[ "$GH_REF" == refs/tags/v* ]]; then
            VERSION="$GH_REF_NAME"
            echo "::notice::Using direct tag push: $VERSION"

          # Priority 2: auto-tag-beta created a beta tag (detect from git)
          elif [[ "$AUTO_TAG_BETA_CREATED" == "true" && -n "$PR_NUMBER" ]]; then
            # Find the most recent beta tag for this PR
            VERSION=$(git tag -l "v*-beta.${PR_NUMBER}.*" --sort=-version:refname | head -1)
            if [ -n "$VERSION" ]; then
              echo "::notice::Found beta tag for PR #$PR_NUMBER: $VERSION"
            else
              echo "::error::auto-tag-beta reported created=true but no tag found for PR #$PR_NUMBER"
              exit 1
            fi

          # Priority 3: auto-tag created a stable tag (detect from git)
          elif [[ "$AUTO_TAG_CREATED" == "true" ]]; then
            # Find the most recent stable tag (exclude betas)
            VERSION=$(git tag -l "v*" --sort=-version:refname | grep -v "beta" | head -1)
            if [ -n "$VERSION" ]; then
              echo "::notice::Found stable tag: $VERSION"
            else
              echo "::error::auto-tag reported created=true but no stable tag found"
              exit 1
            fi

          # Priority 4: Manual dispatch with test version
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="v$INPUT_VERSION"
            echo "::notice::Using manual input version: $VERSION"

          else
            echo "::error::No version could be determined!"
            echo "This usually means release was triggered without a valid tag."
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "::notice::Final version for release: $VERSION"

      - name: Checkout release tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking out tag: $VERSION"
          git checkout "$VERSION"

      - name: Run release (build, GitHub release, Homebrew)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          # Use custom env var name to avoid conflict with GitHub's built-in GITHUB_REF_NAME
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          # DRY_RUN only for test_release, NOT for force_release
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.force_release && 'true' || 'false' }}
          SKIP_NPM: 'true'
        run: npx nx run @gw-tools/gw-tool:release:ci

      - name: Update npm for OIDC support
        if: github.event_name != 'workflow_dispatch' || inputs.force_release
        run: |
          echo "Current npm version: $(npm --version)"
          npm install -g npm@latest
          echo "Updated npm version: $(npm --version)"

      - name: Publish to npm
        if: github.event_name != 'workflow_dispatch' || inputs.force_release
        working-directory: dist/packages/gw-tool/npm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION="${VERSION#v}"  # Remove v prefix

          # Update version in package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          echo "Publishing @gw-tools/gw@$VERSION"

          # Determine npm tag
          if [[ "$VERSION" == *"-"* ]]; then
            NPM_TAG=$(echo "$VERSION" | sed -E 's/.*-([^.]+)\..*/\1/')
            echo "Publishing with tag: $NPM_TAG"
            npm publish --provenance --access public --tag "$NPM_TAG"
          else
            npm publish --provenance --access public
          fi

      - name: Comment on PR (beta releases)
        if: contains(steps.version.outputs.version, '-beta.')
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}'.replace(/^v/, '');

            // Extract PR number from version (e.g., "0.29.0-beta.27.5" -> "27")
            const match = version.match(/-beta\.(\d+)\./);
            if (!match) {
              console.log('Could not extract PR number from version:', version);
              return;
            }
            const prNumber = match[1];

            const body = [
              '## 🧪 Beta Release Published',
              '',
              `**Version:** \`${version}\``,
              '',
              '### Install',
              '```bash',
              '# npm',
              'npm install @gw-tools/gw@beta',
              '',
              '# homebrew',
              'brew install mthines/gw-tools/gw-beta',
              '```',
              '',
              `[View Release](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/v${version})`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
              body
            });

  # ============================================================================
  # Autonomous Workflow Agent Package
  # ============================================================================
  # Separate pipeline for @gw-tools/autonomous-workflow-agent npm package.
  # Simpler than gw-tool: Node.js only, no binaries, no Homebrew/AUR.

  test-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build agent package
        run: npx nx build autonomous-workflow-agent

      - name: Test agent package
        run: npx nx test autonomous-workflow-agent

      - name: Lint agent package
        run: npx nx lint autonomous-workflow-agent

  release-agent:
    # Run on push to main OR manual dispatch with force_release_agent
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.force_release_agent)
    needs: test-agent
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Check for releasable changes
        id: check
        env:
          FORCE_RELEASE: ${{ inputs.force_release_agent }}
        run: |
          # Force release bypasses all checks
          if [ "$FORCE_RELEASE" = "true" ]; then
            echo "::notice::🚀 Force release enabled - skipping change detection"
            echo "should_release=true" >> $GITHUB_OUTPUT
            LAST_TAG=$(git tag -l "autonomous-workflow-agent-v*" --sort=-version:refname | head -n 1)
            echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Skip if this is a release commit
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if [[ "$COMMIT_MSG" =~ ^chore\(autonomous-workflow-agent\):\ release ]]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "::notice::⏭️ Skipping - this is already a release commit"
            exit 0
          fi

          # Check for changes since last agent tag
          LAST_TAG=$(git tag -l "autonomous-workflow-agent-v*" --sort=-version:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            CHANGED=$(git diff --name-only HEAD~1 -- packages/autonomous-workflow-agent/)
          else
            CHANGED=$(git diff --name-only "$LAST_TAG"..HEAD -- packages/autonomous-workflow-agent/)
          fi

          if [ -z "$CHANGED" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "::notice::⏭️ No changes in packages/autonomous-workflow-agent/"
            exit 0
          fi

          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.should_release == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.should_release == 'true'
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.should_release == 'true'

      - name: Calculate version
        if: steps.check.outputs.should_release == 'true'
        id: version
        run: |
          LAST_TAG="${{ steps.check.outputs.last_tag }}"

          # Get commits for version determination
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" --no-merges -- packages/autonomous-workflow-agent/)
          else
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s" --no-merges -- packages/autonomous-workflow-agent/)
          fi

          # Determine bump type from conventional commits
          BUMP_TYPE="patch"
          if echo "$COMMITS" | grep -qE "^(BREAKING CHANGE:|.*!:)"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -q "^feat"; then
            BUMP_TYPE="minor"
          fi

          # Get current version from package.json
          CURRENT=$(cat packages/autonomous-workflow-agent/package.json | grep '"version"' | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          IFS='.' read -ra V <<< "$CURRENT"

          case "$BUMP_TYPE" in
            major) V[0]=$((V[0] + 1)); V[1]=0; V[2]=0 ;;
            minor) V[1]=$((V[1] + 1)); V[2]=0 ;;
            patch) V[2]=$((V[2] + 1)) ;;
          esac

          NEW_VERSION="${V[0]}.${V[1]}.${V[2]}"

          echo "::notice::📦 autonomous-workflow-agent: $CURRENT → $NEW_VERSION ($BUMP_TYPE)"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Build package
        if: steps.check.outputs.should_release == 'true'
        run: npx nx build autonomous-workflow-agent

      - name: Create release tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          # Update package.json version
          cd packages/autonomous-workflow-agent
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" package.json
          cd -

          # Commit and tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/autonomous-workflow-agent/package.json
          git commit -m "chore(autonomous-workflow-agent): release v$NEW_VERSION"
          git tag -a "autonomous-workflow-agent-v$NEW_VERSION" -m "Release autonomous-workflow-agent v$NEW_VERSION"

          git push origin main
          git push origin "autonomous-workflow-agent-v$NEW_VERSION"

          echo "::notice::🏷️ Created tag autonomous-workflow-agent-v$NEW_VERSION"

      - name: Update npm for OIDC support
        if: steps.check.outputs.should_release == 'true'
        run: npm install -g npm@latest

      - name: Publish to npm
        if: steps.check.outputs.should_release == 'true'
        working-directory: dist/packages/autonomous-workflow-agent
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          echo "Publishing @gw-tools/autonomous-workflow-agent@$VERSION"
          npm publish --provenance --access public
