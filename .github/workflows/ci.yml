name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      test_release:
        description: 'Test release job (dry-run, no actual publishing)'
        type: boolean
        default: false
      version:
        description: 'Version to simulate (e.g., 0.28.1) - only used if test_release is true'
        type: string
        default: '0.0.0-test'

# Default permissions for all jobs
permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="typecheck"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Configure git for tests that create commits
      - name: Configure git
        run: |
          git config --global user.email "ci@gw-tools.dev"
          git config --global user.name "CI"

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      - run: npx nx-cloud record -- npx nx format:check --base="remotes/origin/main" || echo "Format check failed"

      # Use Deno-compatible targets (test) instead of tsc-based (build, typecheck)
      - run: npx nx run @gw-tools/gw-tool:test:ci

  auto-tag-beta:
    # Run on non-draft PRs to create beta releases
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.tag.outputs.created || 'false' }}
      version: ${{ steps.tag.outputs.version || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Check for releasable changes
        id: check
        run: |
          # Check if gw-tool source files changed in this PR
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- packages/gw-tool/src/)

          if [ -z "$CHANGED" ]; then
            echo "::notice::⏭️ No source changes in packages/gw-tool/src/"
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Calculate beta version
        if: steps.check.outputs.should_release == 'true'
        id: version
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          echo "📦 Source files changed:"
          echo "${{ steps.check.outputs.changed_files }}"

          # Get commits for version determination
          COMMITS=$(git log origin/${{ github.base_ref }}...HEAD --pretty=format:"%s" --no-merges -- packages/gw-tool/)

          # Determine bump type from conventional commits
          BUMP_TYPE="patch"
          if echo "$COMMITS" | grep -qE "^(BREAKING CHANGE:|.*!:)"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -q "^feat"; then
            BUMP_TYPE="minor"
          fi

          # Get current version and calculate base version
          CURRENT=$(cat packages/gw-tool/npm/package.json | grep '"version"' | sed 's/.*"version": "\([^"]*\)".*/\1/')
          # Strip any existing prerelease suffix
          BASE_CURRENT=$(echo "$CURRENT" | sed -E 's/-.*$//')
          IFS='.' read -ra V <<< "$BASE_CURRENT"

          case "$BUMP_TYPE" in
            major) V[0]=$((V[0] + 1)); V[1]=0; V[2]=0 ;;
            minor) V[1]=$((V[1] + 1)); V[2]=0 ;;
            patch) V[2]=$((V[2] + 1)) ;;
          esac

          BASE_VERSION="${V[0]}.${V[1]}.${V[2]}"

          # Find next beta number for this PR
          EXISTING_BETAS=$(git tag -l "v${BASE_VERSION}-beta.${PR_NUMBER}.*" | wc -l)
          BETA_NUM=$((EXISTING_BETAS + 1))

          NEW_VERSION="${BASE_VERSION}-beta.${PR_NUMBER}.${BETA_NUM}"

          echo "::notice::🧪 Beta version: $NEW_VERSION ($BUMP_TYPE bump, PR #$PR_NUMBER)"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Create beta tag
        if: steps.check.outputs.should_release == 'true'
        id: tag
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create tag (don't modify package.json for betas - just tag the commit)
          git tag -a "v$NEW_VERSION" -m "Beta release v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

          echo "::notice::🏷️ Created beta tag v$NEW_VERSION"
          echo "created=true" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: steps.tag.outputs.created == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.tag.outputs.version }}';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🧪 Beta Release Published

            **Version:** \`${version}\`

            ### Install
            \`\`\`bash
            # npm
            npm install @gw-tools/gw@beta

            # homebrew
            brew install mthines/gw-tools/gw-beta
            \`\`\`

            [View Release](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/v${version})`
            });

  auto-tag:
    # Only run on push to main (not tags, not PRs, not manual dispatch)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created || 'false' }}
      version: ${{ steps.tag.outputs.version || '' }}
    steps:
      # Use PAT to allow tag push to trigger release workflow
      # Falls back to GITHUB_TOKEN if GH_PAT not set (but release won't auto-trigger)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Check for releasable changes
        id: check
        run: |
          # Skip if this is a release commit
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if [[ "$COMMIT_MSG" =~ ^chore\(gw\):\ release\ v ]]; then
            echo "reason=release-commit" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if gw-tool source files changed since last tag
          LAST_TAG=$(git tag -l "v*" --sort=-version:refname | head -n 1)
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

          if [ -z "$LAST_TAG" ]; then
            CHANGED=$(git diff --name-only HEAD~1 -- packages/gw-tool/src/)
          else
            CHANGED=$(git diff --name-only "$LAST_TAG"..HEAD -- packages/gw-tool/src/)
          fi

          if [ -z "$CHANGED" ]; then
            echo "reason=no-source-changes" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Skip - No release needed
        if: steps.check.outputs.should_release == 'false'
        run: |
          if [ "${{ steps.check.outputs.reason }}" = "release-commit" ]; then
            echo "::notice::⏭️ Skipping release - this is already a release commit"
          else
            echo "::notice::⏭️ No release needed - no source changes in packages/gw-tool/src/ since ${{ steps.check.outputs.last_tag || 'initial commit' }}"
          fi
          echo "created=false" >> $GITHUB_OUTPUT
        id: skip

      - name: Calculate version
        if: steps.check.outputs.should_release == 'true'
        id: version
        run: |
          LAST_TAG="${{ steps.check.outputs.last_tag }}"

          echo "📦 Source files changed:"
          echo "${{ steps.check.outputs.changed_files }}"

          # Get commits since last tag for version determination
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" --no-merges -- packages/gw-tool/)
          else
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s" --no-merges -- packages/gw-tool/)
          fi

          # Determine bump type from conventional commits
          BUMP_TYPE="patch"
          if echo "$COMMITS" | grep -qE "^(BREAKING CHANGE:|.*!:)"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -q "^feat"; then
            BUMP_TYPE="minor"
          fi

          # Get current version and calculate new version
          CURRENT=$(cat packages/gw-tool/npm/package.json | grep '"version"' | sed 's/.*"version": "\([^"]*\)".*/\1/')
          IFS='.' read -ra V <<< "$CURRENT"

          case "$BUMP_TYPE" in
            major) V[0]=$((V[0] + 1)); V[1]=0; V[2]=0 ;;
            minor) V[1]=$((V[1] + 1)); V[2]=0 ;;
            patch) V[2]=$((V[2] + 1)) ;;
          esac

          NEW_VERSION="${V[0]}.${V[1]}.${V[2]}"

          echo "::notice::📦 Version bump: $CURRENT → $NEW_VERSION ($BUMP_TYPE)"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Create release tag
        if: steps.check.outputs.should_release == 'true'
        id: tag
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          # Update package.json version
          cd packages/gw-tool/npm
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" package.json
          cd -

          # Commit and tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/gw-tool/npm/package.json
          git commit -m "chore(gw): release v$NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"

          # Push commit and tag
          git push origin main
          git push origin "v$NEW_VERSION"

          echo "::notice::🏷️ Created and pushed tag v$NEW_VERSION"
          echo "created=true" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

  release:
    # Run when:
    # 1. Tag push (v*) - direct tag push triggers release
    # 2. Auto-tag created a new version - release in same workflow
    # 3. Auto-tag-beta created a beta version - release in same workflow
    # 4. Manual dispatch with test_release=true - dry-run testing
    needs: [test, auto-tag, auto-tag-beta]
    if: |
      always() &&
      needs.test.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        needs.auto-tag.outputs.created == 'true' ||
        needs.auto-tag-beta.outputs.created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.test_release)
      )
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # For creating GitHub releases
      id-token: write # For npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.auto-tag.outputs.version && format('v{0}', needs.auto-tag.outputs.version) || needs.auto-tag-beta.outputs.version && format('v{0}', needs.auto-tag-beta.outputs.version) || github.ref }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          # Get version from: auto-tag output, auto-tag-beta output, tag ref, or manual input
          GITHUB_REF_NAME: ${{ needs.auto-tag.outputs.version && format('v{0}', needs.auto-tag.outputs.version) || needs.auto-tag-beta.outputs.version && format('v{0}', needs.auto-tag-beta.outputs.version) || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version)) }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: npx nx run @gw-tools/gw-tool:release:ci
